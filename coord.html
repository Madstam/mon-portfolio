<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes coordonnées - Portfolio Madjda Stambouli</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mes coordonnées</h1>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="formacad.html">Formation</a>
      <a href="competences.html">Compétences</a>
      <a href="projets.html">Projets</a>
      <a href="coord.html">Contact</a>
    </nav>
  </header>
  
  <main>
    <!-- Info cards existantes -->
    <div class="info-card">
      <h3>Adresse mail</h3>
      <p><strong>stambouli.madjda@outlook.com</strong></p>
    </div>
    
    <div class="info-card">
      <h3>Numéro de téléphone</h3>
      <p><strong>07 44 71 04 13</strong></p>
    </div>
    
    <div class="info-card">
      <h3>LinkedIn</h3>
      <p><strong>Madjda Stambouli</strong></p>
    </div>

    <!-- Formulaire de contact -->
    <section class="contact-section">
      <h2>Contactez-moi</h2>
      <form class="contact-form" action="https://formspree.io/f/xjgarppo" method="POST">
        
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" placeholder="Votre nom" required>

        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Votre email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Votre message" required></textarea>

        <button type="submit">Envoyer</button>
      </form>
    </section>
  </main>
  
  <footer>
    <p>&copy; 2025 - Tous droits réservés à ULCO | <a href="index.html">Retour à l'accueil</a></p>
  </footer>

  <!-- Script pour confirmation après envoi -->
  <script>
    const form = document.querySelector('.contact-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = new FormData(form);
      
      const response = await fetch(form.action, {
        method: form.method,
        body: data,
        headers: { 'Accept': 'application/json' }
      });
      
      if (response.ok) {
        alert('Merci pour votre message ! Je vous répondrai bientôt.');
        form.reset();
      } else {
        alert('Oups ! Il y a eu un problème, essayez plus tard.');
      }
    });
  </script>
</body>
</html>
